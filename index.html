## 2. 사업 개요

### 어떤 실무의
행정 공문서 작성, 민원 분류, 규정 대조 및 검토 등 반복적이고 수작업 비중이 높은 행정 실무 영역 ({DOMAIN_SOURCE} 실제 시행 기반)

### 어떤 문제를
- 수작업으로 인한 휴먼 에러(오탈자, 규정 위반, 누락) 발생
- 방대한 매뉴얼과 법령을 일일이 대조하느라 소모되는 과도한 시간
- 부서 간 인수인계 부족 및 담당자 변경 시 업무 공백

### 어떤 방식으로 해결하는지
사용자가 관련 문서나 민원 내용을 입력하거나 업로드하면, 사전 학습된 규정 데이터를 기반으로 자동 검토, 초안 작성, 분류 결과를 제시하여 실무자의 검토 시간과 오류를 혁신적으로 줄인다.

        function updateFilesWithDomain(domainText, sourceText) {
            currentFiles = {};
            for (let [k, template] of Object.entries(baseFiles)) {

                currentFiles[k] = replaced;

        function renderPresets(filter = 'all', keyword = '') {
            const grid = document.getElementById('presets-grid');
            grid.innerHTML = '';
            
            let filtered = domainPresets;
            if (filter !== 'all') {
                filtered = filtered.filter(p => p.cat === filter);
            }
            if (keyword.trim() !== '') {
                const kw = keyword.toLowerCase();
                filtered = filtered.filter(p => p.title.toLowerCase().includes(kw) || p.source.toLowerCase().includes(kw) || p.desc.toLowerCase().includes(kw));
            }

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="col-span-full py-8 text-center text-xs text-slate-400">검색 결과가 없습니다. 직접 입력란을 이용해 보세요!</div>';
                return;
            }
            
            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = "p-3 border border-slate-200 rounded-xl hover:border-brand-500 hover:bg-emerald-50/30 transition cursor-pointer flex flex-col justify-between";
                card.onclick = () => {
                    document.getElementById('custom-domain-input').value = p.title + " (" + p.source + ")";
                };
                card.innerHTML = `
                    <div>
                        <div class="font-bold text-slate-800 text-xs mb-0.5 line-clamp-1">${p.title}</div>
                        <div class="text-[10px] text-emerald-700 font-semibold mb-1">🏛️ 출처: ${p.source}</div>
                        <div class="text-slate-500 text-[11px] line-clamp-1">${p.desc}</div>
                    </div>
                    <div class="mt-2 text-[10px] text-brand-600 font-semibold flex items-center justify-between">
                        <span class="px-1.5 py-0.5 rounded bg-slate-100 text-slate-500 uppercase text-[9px]">${p.cat}</span>
                        <span class="flex items-center space-x-0.5"><span>적용</span><span>→</span></span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterPresets(cat) {
            currentFilter = cat;
            ['all', 'admin', 'doc', 'finance', 'smart'].forEach(c => {
                const btn = document.getElementById(`tab-${c}`);
                if (btn) {
                    if (c === cat) {
                        btn.className = "px-3 py-1 text-xs font-semibold rounded-lg bg-brand-600 text-white transition";
                    } else {
                        btn.className = "px-3 py-1 text-xs font-semibold rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 transition";
                    }
                }
            });
            const kw = document.getElementById('domain-search-input').value;
            renderPresets(cat, kw);
        }

            const kw = document.getElementById('domain-search-input').value;
            renderPresets(currentFilter, kw);

            if (isEditing) {
                saveCurrentEdit();
            }
            activeFileKey = key;
            renderNav();
            updateDocView();

        function updateDocView() {
            document.getElementById('doc-badge').textContent = activeFileKey;

                '1_2.md': 'AI 행정실무 코치 역할 및 진행 원칙 (1)',

            document.getElementById('viewer-pane').textContent = content;
            document.getElementById('editor-pane').value = content;

        function toggleEditMode() {
            isEditing = !isEditing;
            const viewer = document.getElementById('viewer-pane');
            const editor = document.getElementById('editor-pane');
            const btn = document.getElementById('edit-mode-btn');

            if (isEditing) {
                viewer.classList.add('hidden');
                editor.classList.remove('hidden');
                btn.textContent = '저장하기';
                btn.classList.remove('bg-brand-600', 'hover:bg-brand-700');
                btn.classList.add('bg-emerald-600', 'hover:bg-emerald-700');
            } else {
                currentFiles[activeFileKey] = editor.value;
                editor.classList.add('hidden');
                viewer.classList.remove('hidden');
                btn.textContent = '편집하기';
                btn.classList.remove('bg-emerald-600', 'hover:bg-emerald-700');
                btn.classList.add('bg-brand-600', 'hover:bg-brand-700');
                updateDocView();
                showToast('변경사항이 저장되었습니다.');
            }
        }

        function saveCurrentEdit() {
            if (isEditing) {
                currentFiles[activeFileKey] = document.getElementById('editor-pane').value;
                isEditing = false;
                document.getElementById('editor-pane').classList.add('hidden');
                document.getElementById('viewer-pane').classList.remove('hidden');
                const btn = document.getElementById('edit-mode-btn');
                btn.textContent = '편집하기';
                btn.classList.remove('bg-emerald-600');
                btn.classList.add('bg-brand-600');
            }
        }

        function copyCurrentContent() {
            saveCurrentEdit();
            const text = currentFiles[activeFileKey];
            document.execCommand ? copyLegacy(text) : navigator.clipboard.writeText(text);
            showToast('현재 문서 내용이 복사되었습니다.');
        }

        function copyLegacy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
        }

        function downloadCurrentFile() {
            saveCurrentEdit();
            const text = currentFiles[activeFileKey];
            const blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = activeFileKey;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast(`${activeFileKey} 파일이 다운로드되었습니다.`);
        }

        function downloadAllMarkdown() {
            saveCurrentEdit();
            let combined = "# 대한민국 실증 공공 행정 실무 전체 초안 및 단계별 문서 모음\n# 도메인: " + currentDomainName + "\n# 출처: " + currentDomainSource + "\n\n";
            for (const [k, v] of Object.entries(currentFiles)) {
                combined += `\n\n---\n\n## File: ${k}\n\n` + v;
            }
            const blob = new Blob([combined], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'verified_ai_admin_drafts_download.md';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('통합본(verified_ai_admin_drafts_download.md)이 다운로드되었습니다.');
        }

        function openDomainModal() {
            document.getElementById('domain-modal').classList.remove('hidden');
        }

        function closeDomainModal() {
            document.getElementById('domain-modal').classList.add('hidden');
        }

        function applySelectedDomain() {
            const val = document.getElementById('custom-domain-input').value.trim();
            if (val) {
                // Extract title and source if formatted with parentheses
                let title = val;
                let source = "대한민국 공공기관 실증 공식 사례";
                if (val.includes("(") && val.includes(")")) {
                    const parts = val.split("(");
                    title = parts[0].trim();
                    source = parts[1].replace(")", "").trim();
                }
                currentDomainName = title;
                currentDomainSource = source;
                document.getElementById('current-domain-label').textContent = `${currentDomainName} (${currentDomainSource})`;
                updateFilesWithDomain(currentDomainName, currentDomainSource);
                updateDocView();
                showToast(`모든 실무 초안이 [${currentDomainName}] (출처: ${currentDomainSource})에 맞게 재생성되었습니다.`);
            }
            closeDomainModal();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = msg;
            toast.classList.remove('translate-y-16', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-16', 'opacity-0');
            }, 3000);
        }

        // Initialize on load
        window.onload = function() {
            renderPresets('all', '');
            renderNav();
            updateDocView();
        };
    </script>
